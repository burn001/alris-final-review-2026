<style>
/* 관제실(C) 틀 · 1280×720 원판을 화면에 맞춰 키움 · 어두운 단일 화면(테마 전환 없음) */
:root {
  color-scheme: dark;
  --void: #05090f; --bg0: #0a1424; --bg1: #17305a;
  --ink: #e6eef8; --mu: #9fb3d1; --mu2: #7f93b3; --dim: #5f7393;
  --line: #22385c; --panel: rgba(17, 31, 54, .82); --panel2: rgba(24, 44, 76, .7);
  --cy: #4fd1e8; --cy2: #1e4f7a; --ok: #4fd1e8; --warn: #f4b740; --bad: #ff7a66;
  --f-ui: "Noto Sans KR", "Malgun Gothic", sans-serif; --f-mono: "JetBrains Mono", Consolas, monospace;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--ink); font-family: var(--f-ui); margin: 0; }
.page { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#deck { position: relative; width: 100%; flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; }
#deck:fullscreen { background: #000; padding: 0; }
#stage { position: relative; overflow: hidden; border-radius: 8px; box-shadow: 0 24px 70px rgba(0,0,0,.6); max-width: 100%; }
#deck:fullscreen #stage { border-radius: 0; box-shadow: none; }
#canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; font-size: 13px; color: var(--mu); max-width: 100%; }
.ctl button { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 6px; border: 1px solid #2b3f60; background: #111c2e; color: var(--ink); cursor: pointer; }
.ctl button:hover { border-color: var(--cy); }
.ctl button[aria-pressed="true"] { background: #0f3a4a; border-color: var(--cy); color: var(--cy); }
.ctl button:focus-visible, a:focus-visible { outline: 2px solid var(--cy); outline-offset: 2px; }
.ctl .pos { font-family: var(--f-mono); min-width: 74px; text-align: center; }
.ctl .hint { color: var(--dim); font-size: 12px; }
@media (max-width: 600px) { .ctl .hint { display: none; } }

/* ── 장면 공통 ── */
.slide { position: absolute; inset: 0; width: 1280px; height: 720px; overflow: hidden; box-sizing: border-box;
  background: radial-gradient(ellipse at 72% -8%, var(--bg1) 0%, var(--bg0) 58%); color: var(--ink); font-family: var(--f-ui); }
.slide * { box-sizing: border-box; }
.slide::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(rgba(79,209,232,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(79,209,232,.045) 1px, transparent 1px); background-size: 40px 40px;
  mask-image: radial-gradient(ellipse at 50% 40%, #000 30%, transparent 85%); }
.slide.ch { background: radial-gradient(ellipse at 20% 50%, #123a5e 0%, #071020 62%); }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
.glow { text-shadow: 0 0 16px rgba(79,209,232,.55); }
.cy { color: var(--cy); } .mu { color: var(--mu); } .mu2 { color: var(--mu2); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.pn { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.hd { position: absolute; left: 60px; right: 60px; top: 30px; display: flex; align-items: center; gap: 16px; }
.hd .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--cy); box-shadow: 0 0 12px var(--cy); flex: none; }
.hd .eb { font: 500 13px var(--f-mono); color: var(--cy); letter-spacing: .12em; }
.hd .t { font-size: 29px; font-weight: 700; line-height: 1.25; margin-top: 2px; letter-spacing: -.01em; }
.hd .ref { margin-left: auto; align-self: flex-start; margin-top: 4px; font: 500 14px var(--f-mono); color: var(--mu2); white-space: nowrap; }
.lab { font: 700 13px var(--f-mono); color: var(--cy); letter-spacing: .1em; }
.h3 { font-size: 20px; font-weight: 700; }
.note { position: absolute; left: 60px; right: 60px; display: flex; gap: 16px; align-items: baseline; border-top: 1px dashed #2c4a74; padding-top: 12px; font-size: 18px; line-height: 1.55; color: #c4d2e6; }
.note .k { font: 700 12px var(--f-mono); color: var(--cy); letter-spacing: .12em; flex: none; }
ul.li { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
ul.li li { position: relative; padding-left: 18px; font-size: 17px; line-height: 1.5; color: #d3deee; }
ul.li li::before { content: ""; position: absolute; left: 0; top: .62em; width: 7px; height: 7px; border-radius: 1px; background: var(--cy); box-shadow: 0 0 6px var(--cy); }
ul.li.w li::before { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
.chip { display: inline-block; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; }
.bar { height: 10px; border-radius: 5px; background: #1a2c49; position: relative; overflow: hidden; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: linear-gradient(90deg, var(--cy2), var(--cy)); box-shadow: 0 0 10px rgba(79,209,232,.5); }

/* 상시 겹 · 진행 바, 꼬리말, 자막 */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
#prog { position: absolute; left: 0; right: 0; top: 0; height: 5px; display: flex; gap: 3px; pointer-events: auto; }
#prog .seg { position: relative; height: 100%; background: rgba(79,209,232,.12); cursor: pointer; }
#prog .seg i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cy); box-shadow: 0 0 8px var(--cy); transition: width .5s ease; }
#ft { position: absolute; left: 60px; right: 60px; bottom: 18px; display: flex; justify-content: space-between; font: 500 13px var(--f-mono); color: var(--dim); }
#ft .c { color: var(--mu2); }
#sub { position: absolute; left: 140px; right: 140px; bottom: 50px; display: flex; justify-content: center; }
#sub span { display: inline-block; max-width: 1000px; text-align: center; font-size: 25px; font-weight: 500; line-height: 1.45; color: #fff;

  animation: subIn .35s ease both; }
@keyframes subIn { from { opacity: 0; transform: translateY(8px); } }

/* 장면 전환 */
.slide.enter { animation: enter .6s cubic-bezier(.2,.7,.2,1) both; }
.slide.leave { animation: leave .45s ease both; z-index: 2; }
@keyframes enter { from { opacity: 0; transform: scale(1.025); filter: blur(6px); } }
@keyframes leave { to { opacity: 0; transform: scale(.985); filter: blur(4px); } }

/* 효과: .play가 걸린 동안만 돎. 걸리지 않은 상태가 곧 완성된 정지 화면 */
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes growY { from { transform: scaleY(0); } }
@keyframes draw { from { stroke-dashoffset: var(--len, 2000); } }
@keyframes ring { from { stroke-dashoffset: var(--c); } }
@keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.6); } }
@keyframes stamp { 0% { opacity: 0; transform: scale(1.8); } 70% { opacity: 1; transform: scale(.94); } }
@keyframes wipe { from { clip-path: inset(0 100% 0 0); } }
@keyframes pop { 0% { opacity: 0; transform: scale(.6); } 70% { transform: scale(1.06); } }
@keyframes tint { from { background: #2a3550; border-color: #3a4a68; } }
@keyframes sweep { to { transform: rotate(360deg); } }
@keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
.play .a-rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0s); }
.play .a-fade { animation: fade .8s ease both; animation-delay: var(--d, 0s); }
.play .a-grow { transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0s); }
.play .a-bar { transform-origin: center bottom; animation: growY .9s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0s); }
.play .a-draw { stroke-dasharray: var(--len, 2000); animation: draw 1.4s ease both; animation-delay: var(--d, 0s); }
.play .a-ring { animation: ring 1.5s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0s); }
.play .a-stamp { animation: stamp .5s cubic-bezier(.3,1.4,.5,1) both; animation-delay: var(--d, 0s); }
.play .a-wipe { animation: wipe .9s cubic-bezier(.6,0,.2,1) both; animation-delay: var(--d, 0s); }
.play .a-pop { animation: pop .55s cubic-bezier(.3,1.3,.5,1) both; animation-delay: var(--d, 0s); }
.a-pulse { animation: pulse 2.4s ease-in-out infinite; }
.radar .sw { transform-origin: 110px 110px; animation: sweep 4s linear infinite; }
.lpdot { transform-origin: 300px 236px; animation: sweep 6s linear infinite; }
.radar .bl { animation: blink 2.2s ease-in-out infinite; animation-delay: var(--d, 0s); }
/* 켬/끔 스위치 */
.sw-t { position: relative; width: 52px; height: 26px; border-radius: 13px; border: 1px solid #3a4a68; background: #1b2740; flex: none; }
.sw-t b { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #6b7b96; }
.sw-t.on { background: rgba(79,209,232,.22); border-color: var(--cy); }
.sw-t.on b { left: 29px; background: var(--cy); box-shadow: 0 0 10px var(--cy); }
.play .sw-t.on { animation: tint .4s ease both; animation-delay: var(--d, 0s); }
.play .sw-t.on b { animation: knob .4s cubic-bezier(.3,1.3,.5,1) both; animation-delay: var(--d, 0s); --x: -26px; }
@keyframes knob { from { transform: translateX(-26px); background: #6b7b96; box-shadow: none; } }
@media (prefers-reduced-motion: reduce) { .play *, .slide.enter, .slide.leave, .a-pulse, .radar .sw, .radar .bl, .lpdot, #sub span { animation: none !important; } }

/* 서비스 화면 링크 단추 */
.lnk { font: 700 12.5px var(--f-ui); padding: 5px 10px; border-radius: 5px; border: 1px solid var(--cy); background: rgba(79,209,232,.12); color: var(--cy); cursor: pointer; text-decoration: none; }
.lnk:hover { background: rgba(79,209,232,.25); }
.slide a { color: inherit; }
.slide a.cy { color: var(--cy); }
/* Agent4D 실행 단추 */
.go { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-decoration: none; color: var(--ink);
  border-radius: 14px; border: 2px solid var(--cy); background: radial-gradient(ellipse at 50% 30%, rgba(79,209,232,.28), rgba(10,20,36,.9) 70%);
  box-shadow: 0 0 40px rgba(79,209,232,.25), inset 0 0 30px rgba(79,209,232,.12); transition: transform .2s ease, box-shadow .2s ease; }
.go:hover { transform: scale(1.02); box-shadow: 0 0 60px rgba(79,209,232,.45), inset 0 0 30px rgba(79,209,232,.2); }
.go .tri { width: 0; height: 0; border-left: 46px solid var(--cy); border-top: 28px solid transparent; border-bottom: 28px solid transparent; filter: drop-shadow(0 0 12px var(--cy)); margin-left: 12px; }
</style>

function ringG(v, goal, col, R, sw, delay) {

/* ════════════ 장면 ════════════ */

  html: (s) => {

add({ ch: 3, eb: "과제 1 / 3 · 근거", ref: "3장 3절 2) 73쪽", sub: [

    ${o.example}</div>
  <div style="position:absolute;left:942px;top:118px;width:278px;display:flex;flex-direction:column;gap:12px">
    <div class="pn a-rise" ${d(.7)} style="position:relative;padding:14px 16px;border-color:rgba(244,183,64,.45)"><div class="lab" style="color:var(--warn)">${o.cautionTitle}</div>

  <div class="pn a-rise" ${d(.4)} style="left:862px;top:118px;width:358px;height:306px;padding:14px 18px"><div class="lab">수행할 수 있다고 보는 근거</div>

/* ════════════ 재생 엔진 ════════════ */
const layer = document.getElementById("layer"), canvas = document.getElementById("canvas"), stage = document.getElementById("stage"), deck = document.getElementById("deck");
const subEl = document.getElementById("sub"), RM = matchMedia("(prefers-reduced-motion: reduce)");
let cur = -1, auto = false, timers = [];
/* 장 진행 바 */
const prog = document.getElementById("prog");
const chStart = CH.map((_, c) => S.findIndex((x) => x.ch === c));
const chCount = CH.map((_, c) => S.filter((x) => x.ch === c).length);
prog.innerHTML = CH.map((c, i) => `<div class="seg" data-ch="${i}" title="${c}" style="flex:${chCount[i]}"><i></i></div>`).join("");
prog.addEventListener("click", (e) => { const sg = e.target.closest(".seg"); if (sg) { stopAuto(); go(chStart[+sg.dataset.ch]); } });

function prep(root) {
  root.querySelectorAll("[data-d]").forEach((el) => el.style.setProperty("--d", el.dataset.d + "s"));
  root.querySelectorAll("[data-count]").forEach((el) => { if (!el.dataset.final) el.dataset.final = el.textContent; });
}
function finalize(root) { root.querySelectorAll("[data-count]").forEach((el) => { el._tok = (el._tok || 0) + 1; el.textContent = el.dataset.final; }); }
function countUp(root) {
  root.querySelectorAll("[data-count]").forEach((el) => {
    const fin = el.dataset.final, target = parseFloat(el.dataset.count), dec = ((fin.split(".")[1] || "").match(/^\d+/) || [""])[0].length;
    const f = (v) => dec ? v.toFixed(dec) : Math.round(v).toLocaleString("ko-KR");
    const delay = parseFloat(el.closest("[data-d]")?.dataset.d || 0) * 1000;
    const tok = el._tok = (el._tok || 0) + 1, dur = 1300;
    const done = () => { if (el._tok === tok) el.textContent = fin; };
    setTimeout(() => {
      if (el._tok !== tok) return; const t0 = performance.now();
      const step = (now) => { if (el._tok !== tok) return; if (document.hidden) return done();
        const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
        if (p < 1) { el.textContent = f(target * e); requestAnimationFrame(step); } else done(); };
      el.textContent = f(0); requestAnimationFrame(step); setTimeout(done, dur + 400);
    }, delay);
  });
}
function play(sl) {
  if (!sl) return; clearTimeout(sl._end); sl.classList.remove("play"); finalize(sl);
  if (RM.matches || document.hidden) return;
  void sl.offsetWidth; sl.classList.add("play"); countUp(sl);
  sl._end = setTimeout(() => { sl.classList.remove("play"); finalize(sl); }, 4600);
}
function go(i) {
  i = Math.max(0, Math.min(S.length - 1, i)); if (i === cur && layer.firstElementChild) return;
  const old = layer.querySelector(".slide:not(.leave)");
  if (old) { old.classList.remove("enter", "play"); old.classList.add("leave"); setTimeout(() => old.remove(), 460); }
  cur = i; const sc = S[i];
  const w = document.createElement("div"); w.innerHTML = sc.html(sc); const sl = w.firstElementChild;
  layer.appendChild(sl); prep(sl);
  if (!RM.matches) sl.classList.add("enter");
  play(sl);
  document.getElementById("ftc").textContent = CH[sc.ch];
  document.getElementById("ftn").textContent = String(i + 1).padStart(2, "0") + " / " + S.length;
  document.getElementById("pos").textContent = (i + 1) + " / " + S.length;
  prog.querySelectorAll(".seg").forEach((sg, c) => { const st = chStart[c], n = chCount[c]; sg.firstElementChild.style.width = (i >= st + n ? 100 : i < st ? 0 : ((i - st + 1) / n * 100)) + "%"; });
  try { history.replaceState(null, "", "#s" + (i + 1)); } catch (e) { location.hash = "s" + (i + 1); }
  if (auto) runAuto();
}
/* 자동 재생: 해설 자막을 문장 단위로 띄우고 끝나면 다음 장면으로 */
function clearT() { timers.forEach(clearTimeout); timers = []; }
function runAuto() {
  clearT(); const sc = S[cur], lines = sc.sub || [];
  let t = sc.chap ? 500 : 1100;
  subEl.hidden = false; subEl.innerHTML = "";
  lines.forEach((ln) => {
    const len = Math.max(2600, ln.length * 145);
    timers.push(setTimeout(() => { subEl.innerHTML = `<span>${ln}</span>`; }, t)); t += len;
  });
  t += sc.chap ? 600 : 1400;
  if (sc.dur) t = Math.max(t, sc.dur * 1000);
  timers.push(setTimeout(() => { subEl.innerHTML = ""; if (cur < S.length - 1) go(cur + 1); else stopAuto(); }, t));
}
function startAuto() { auto = true; bAuto.setAttribute("aria-pressed", "true"); bAuto.textContent = "❚❚ 자동 재생 멈춤"; runAuto(); }
function stopAuto() { auto = false; clearT(); subEl.hidden = true; subEl.innerHTML = ""; bAuto.setAttribute("aria-pressed", "false"); bAuto.textContent = "▶ 자동 재생(해설 자막)"; }
const bAuto = document.getElementById("bAuto");
bAuto.onclick = () => auto ? stopAuto() : startAuto();
document.getElementById("bPrev").onclick = () => { stopAuto(); go(cur - 1); };
document.getElementById("bNext").onclick = () => { stopAuto(); go(cur + 1); };
document.getElementById("bReplay").onclick = () => play(layer.querySelector(".slide:not(.leave)"));
const bFull = document.getElementById("bFull");
function toggleFull() { try { if (document.fullscreenElement) document.exitFullscreen(); else deck.requestFullscreen().catch(() => {}); } catch (e) {} }
bFull.onclick = toggleFull;
/* 화면 맞춤 */
function fit() {
  const full = document.fullscreenElement === deck;
  const aw = full ? innerWidth : deck.clientWidth, ah = full ? innerHeight : Math.max(200, innerHeight - 90);
  const k = Math.min(aw / 1280, ah / 720);
  stage.style.width = 1280 * k + "px"; stage.style.height = 720 * k + "px"; canvas.style.transform = `scale(${k})`;
}
addEventListener("resize", fit); document.addEventListener("fullscreenchange", fit);
new ResizeObserver(fit).observe(deck);
document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("button, a") && (e.key === "Enter" || e.key === " ")) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === "Enter") { e.preventDefault(); stopAuto(); go(cur + 1); }
  else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace") { e.preventDefault(); stopAuto(); go(cur - 1); }
  else if (k === "Home") { stopAuto(); go(0); } else if (k === "End") { stopAuto(); go(S.length - 1); }
  else if (k === " " || k === "a" || k === "A") { e.preventDefault(); auto ? stopAuto() : startAuto(); }
  else if (k === "f" || k === "F") toggleFull();
  else if (k === "r" || k === "R") play(layer.querySelector(".slide:not(.leave)"));
  else if (k === "Escape" && auto) stopAuto();
});
document.addEventListener("visibilitychange", () => { if (document.hidden) { const sl = layer.querySelector(".slide"); if (sl) { sl.classList.remove("play"); finalize(sl); } } });
document.addEventListener("click", (e) => {
  const b = e.target.closest && e.target.closest("[data-copy]"); if (!b) return;
  const t = b.dataset.copy, done = (msg) => { b.textContent = msg; setTimeout(() => { b.textContent = "질의 복사"; }, 1600); };
  const fallback = () => { const q = b.closest(".pn") && b.closest(".pn").querySelector(".q-text"); if (q) { const r = document.createRange(); r.selectNodeContents(q); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } done("선택됨 · Ctrl+C"); };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => done("복사됨"), fallback); else fallback(); } catch (err) { fallback(); }
});
function fromHash() { const m = /^#s(\d+)$/.exec(location.hash); return m ? +m[1] - 1 : 0; }
addEventListener("hashchange", () => { const i = fromHash(); if (i !== cur) go(i); });
fit(); go(fromHash());
</script>
